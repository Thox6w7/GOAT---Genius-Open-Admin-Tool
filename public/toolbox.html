<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #94a3b8; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 flex flex-col min-h-screen">

    <!-- HEADER DE NAVIGATION -->
    <header class="border-b border-slate-800 bg-[#0f172a] px-6 py-3.5 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-black tracking-widest text-amber-400 font-mono">G.O.A.T</span>
            <span class="text-xs bg-amber-950/80 text-amber-300 font-mono border border-amber-800/80 px-2 py-0.5 rounded uppercase">Pre-Alpha</span>
        </div>
        <nav class="flex items-center space-x-6 text-sm font-semibold">
            <a href="/" class="text-slate-400 hover:text-amber-400 transition-colors flex items-center space-x-2">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Vue Générale</span>
            </a>
            <a href="/minecraft.html" class="text-slate-400 hover:text-amber-400 transition-colors flex items-center space-x-2">
                <i class="fa-solid fa-server"></i>
                <span>Serveurs Minecraft</span>
            </a>
            <a href="/toolbox.html" class="text-amber-400 border-b-2 border-amber-400 pb-1 flex items-center space-x-2">
                <i class="fa-solid fa-toolbox"></i>
                <span>Boîte à Outils</span>
            </a>
        </nav>
    </header>

    <!-- ZONE CENTRALE : MESSAGE EN COURS DE RÉALISATION -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="bg-[#0f172a] border border-slate-800 rounded-xl p-8 max-w-lg w-full text-center space-y-5 shadow-2xl">
            <div class="h-16 w-16 mx-auto rounded-xl bg-amber-950/50 border border-amber-600/40 flex items-center justify-center text-amber-400 text-3xl">
                <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>
            
            <div class="space-y-2">
                <h1 class="text-2xl font-bold font-mono text-slate-100 tracking-wide">
                    En cours de réalisation
                </h1>
                <p class="text-sm text-slate-400 leading-relaxed">
                    Le module de boîte à outils et d'utilitaires autonomes est actuellement en restructuration.
                </p>
            </div>

            <div class="pt-4 border-t border-slate-800/80 flex justify-center">
                <a href="/minecraft.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono font-bold rounded border border-slate-700 flex items-center space-x-2 transition-all">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Retour aux serveurs Minecraft</span>
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 bg-[#090d16] py-4 text-center text-xs font-mono text-slate-500">
        Genius Open Admin Tool (GOAT) — Module Toolbox
    </footer>

</body>
</html>
